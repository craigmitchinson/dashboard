name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # ---- dashboard (SPA + data pipeline) ----------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npm test

      - name: Rebuild dashboard data (mock CSV -> model.json + views)
        run: npm run data:all

      - name: Verify economics parity (client engine vs baked pipeline totals)
        run: npm run data:verify

      - name: Regenerate PLAYBOOK.md
        run: npm run docs:playbook

      - name: Fail if PLAYBOOK.md drifted from its generator
        run: git diff --exit-code PLAYBOOK.md

      # ---- data API service (server/) ----------------------------------------
      # Runs AFTER data:all: the assembler contract test replays the freshly
      # generated public/data/views/vw_Model*.json fixtures through the shared
      # assembler and must reproduce public/data/model.json exactly — that is
      # the guarantee that the static build and the live API can never drift.
      - name: Server — install
        run: npm ci
        working-directory: server

      - name: Server — type check + build
        run: npm run build
        working-directory: server

      - name: Server — tests (assembler parity, reference write order, auth)
        run: npm test
        working-directory: server
